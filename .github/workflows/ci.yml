name: CI

on:
  pull_request:
  push:
    branches-ignore:
      - main

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python deps
        run: pip install ruff sqlfluff yamllint

      - name: Install Node deps
        run: npm --prefix frontend ci

      - name: ruff check (Python)
        run: ruff check backend/ synthetic/

      - name: ruff format check (Python)
        run: ruff format --check backend/ synthetic/

      - name: eslint (TypeScript)
        run: npm --prefix frontend run lint

      - name: prettier check (TypeScript)
        run: npm --prefix frontend run format:check

      - name: yamllint
        run: yamllint -c .yamllint.yml .

      - name: sqlfluff (SQL)
        run: sqlfluff lint --dialect snowflake sql/

      - name: hadolint (Dockerfiles)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: frontend/Dockerfile

      - name: hadolint (backend)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: backend/Dockerfile

      - name: hadolint (router)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: router/Dockerfile

  test-backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -r backend/requirements-dev.txt

      - name: Run tests with coverage
        run: pytest tests/backend --cov=backend --cov-report=xml -q

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-backend
          path: coverage.xml

  test-frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        run: npm --prefix frontend ci

      - name: Run tests with coverage
        run: npm --prefix frontend test -- --run --coverage

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-frontend
          path: frontend/coverage/

  build-images:
    name: Build Docker images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build frontend image
        run: docker build --platform=linux/amd64 -t invoiceops-frontend:ci ./frontend

      - name: Build backend image
        run: docker build --platform=linux/amd64 -t invoiceops-backend:ci ./backend

      - name: Build router image
        run: docker build --platform=linux/amd64 -t invoiceops-router:ci ./router

  sql-syntax:
    name: SQL syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install sqlfluff
        run: pip install sqlfluff

      - name: sqlfluff lint
        run: sqlfluff lint --dialect snowflake sql/
